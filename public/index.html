<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lewis Quiz</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
  <link rel="stylesheet" href="stats.css">
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
      --accent: #4f46e5; --accent-soft: #eef2ff;
      --new: #2563eb; --learn: #dc2626; --review: #16a34a;
      --ok-bg: #e7f6ec; --ok: #15803d; --bad-bg: #fde8e8; --bad: #b91c1c;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12141a; --card: #1b1e27; --text: #e8eaf0; --muted: #9aa1ad; --line: #2b2f3b;
        --accent: #818cf8; --accent-soft: #252a45;
        --new: #60a5fa; --learn: #f87171; --review: #4ade80;
        --ok-bg: #16301f; --ok: #4ade80; --bad-bg: #3a1d1d; --bad: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 60px; }
    h1 { font-size: 1.35rem; margin: 0; }
    h2 { font-size: 1.05rem; margin: 28px 0 10px; }
    button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 14px; }
    button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button.link { border: 0; background: none; color: var(--muted); padding: 4px 6px; text-decoration: underline; }
    input { font: inherit; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); min-width: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
    .row { display: flex; align-items: center; gap: 12px; }
    .spread { justify-content: space-between; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .stack > * + * { margin-top: 10px; }
    .header { margin-bottom: 18px; }
    .n-new { color: var(--new); font-weight: 600; }
    .n-learn { color: var(--learn); font-weight: 600; }
    .n-review { color: var(--review); font-weight: 600; }
    .counts { display: flex; gap: 14px; font-size: .9rem; flex-wrap: wrap; }
    .bar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; margin-top: 8px; }
    .bar > span { display: block; height: 100%; }
    .topic { display: flex; align-items: center; gap: 14px; }
    .topic .info { flex: 1; min-width: 0; }
    .topic .name { font-weight: 600; }
    .users { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .users button { padding: 14px; text-align: left; font-weight: 600; }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat { text-align: center; padding: 14px 8px; }
    .stat b { display: block; font-size: 1.5rem; }
    .list { list-style: none; margin: 0; padding: 0; }
    .list li { padding: 8px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: baseline; }
    .list li:first-child { border-top: 0; }
    .list .q { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }

    .question { font-size: 1.12rem; font-weight: 500; margin: 4px 0 18px; white-space: pre-wrap; }
    .question pre { font: .85em/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--accent-soft); padding: 8px 10px; border-radius: 8px; margin: 8px 0; overflow-x: auto; }
    .options { display: grid; gap: 10px; }
    .option { display: flex; gap: 12px; align-items: flex-start; text-align: left; padding: 12px 14px; width: 100%; }
    .option .letter { font-weight: 700; color: var(--muted); min-width: 1.2em; }
    .option .letter + span { white-space: pre-line; }
    .option.correct { background: var(--ok-bg); border-color: var(--ok); }
    .option.wrong { background: var(--bad-bg); border-color: var(--bad); }
    .option.missed { border-style: dashed; }
    .option:disabled { cursor: default; opacity: 1; color: var(--text); }
    .option.dim { opacity: .55; }
    .option.selected { background: var(--accent-soft); border-color: var(--accent); }
    .multi-hint { margin: -10px 0 12px; }
    .tabs { display: flex; gap: 6px; margin-bottom: 18px; flex-wrap: wrap; }
    .tabs button { border-radius: 99px; padding: 6px 14px; }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    .feedback { margin-top: 16px; padding: 12px 14px; border-radius: 10px; }
    .feedback.ok { background: var(--ok-bg); }
    .feedback.bad { background: var(--bad-bg); }
    .feedback p { margin: 4px 0 0; color: var(--text); }
    .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
    .grades.one { grid-template-columns: 1fr; }
    .grade { display: flex; flex-direction: column; align-items: center; padding: 8px 4px; }
    .grade small { color: var(--muted); font-size: .78rem; }
    .grade.again { border-color: var(--learn); } .grade.hard { border-color: #d97706; }
    .grade.good { border-color: var(--review); } .grade.easy { border-color: var(--new); }
    .tag { display: inline-block; font-size: .75rem; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
    .banner { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; font-size: .9rem; margin-bottom: 12px; }
    .kbd { font-size: .78rem; color: var(--muted); margin-top: 14px; text-align: center; }
    .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--bad); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 1000; }
    code { font: .9em ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; }
    details summary { cursor: pointer; }

    /* Ranking & Métricas */
    .btn-ranking { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .btn-ranking:hover { background: var(--accent); color: #fff; }

    .user-rank-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 18px;
      border-radius: var(--radius);
      background: color-mix(in srgb, var(--accent) 8%, var(--card));
      border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line));
      margin-bottom: 18px;
      cursor: pointer;
      transition: border-color .15s ease, transform .15s ease;
    }
    .user-rank-banner:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .user-rank-banner .left { display: flex; align-items: center; gap: 14px; }
    .user-rank-banner .rank-badge {
      font-size: 1.35rem;
      font-weight: 800;
      background: var(--card);
      border: 1px solid var(--line);
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* Podio visual (Top 3) */
    .podium {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin: 20px 0 24px;
      align-items: flex-end;
    }
    .podium-slot {
      text-align: center;
      padding: 16px 10px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: var(--card);
      position: relative;
      transition: transform .15s ease, box-shadow .15s ease;
      cursor: pointer;
    }
    .podium-slot:hover { transform: translateY(-3px); box-shadow: 0 4px 14px rgba(0,0,0,0.06); }
    .podium-slot.first {
      order: 2;
      border-color: #f59e0b;
      background: linear-gradient(180deg, color-mix(in srgb, #f59e0b 14%, var(--card)) 0%, var(--card) 100%);
      padding-top: 24px;
      padding-bottom: 24px;
    }
    .podium-slot.second {
      order: 1;
      border-color: #94a3b8;
      background: linear-gradient(180deg, color-mix(in srgb, #94a3b8 10%, var(--card)) 0%, var(--card) 100%);
    }
    .podium-slot.third {
      order: 3;
      border-color: #d97706;
      background: linear-gradient(180deg, color-mix(in srgb, #d97706 10%, var(--card)) 0%, var(--card) 100%);
    }
    .podium-slot.is-me {
      box-shadow: 0 0 0 2px var(--accent);
    }
    .podium-crown { font-size: 2rem; line-height: 1; margin-bottom: 4px; }
    .podium-rank { font-size: 0.8rem; font-weight: 700; color: var(--muted); margin-bottom: 4px; text-transform: uppercase; }
    .podium-name { font-weight: 700; font-size: 1.05rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-bottom: 6px; }
    .podium-score { font-size: 1.55rem; font-weight: 800; line-height: 1.1; }

    /* Calificaciones / Badges */
    .badge-grade {
      display: inline-block;
      font-size: .75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 99px;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .badge-sobresaliente { background: #fef3c7; color: #b45309; border: 1px solid #fde68a; }
    .badge-notable { background: var(--ok-bg); color: var(--ok); border: 1px solid color-mix(in srgb, var(--ok) 30%, transparent); }
    .badge-aprobado { background: var(--accent-soft); color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
    .badge-suspenso { background: var(--bad-bg); color: var(--bad); border: 1px solid color-mix(in srgb, var(--bad) 30%, transparent); }

    @media (prefers-color-scheme: dark) {
      .badge-sobresaliente { background: #3b2808; color: #fbbf24; border-color: #78350f; }
    }

    .badge-you {
      font-size: .65rem;
      background: var(--accent);
      color: #fff;
      padding: 2px 7px;
      border-radius: 99px;
      font-weight: 700;
      margin-left: 6px;
      vertical-align: middle;
      text-transform: uppercase;
    }

    /* Barra de nota (0-10) */
    .score-meter {
      height: 6px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 6px;
    }
    .score-meter-fill {
      height: 100%;
      border-radius: 99px;
      transition: width .3s ease;
    }

    /* Tabla / Lista de ranking */
    .ranking-list { display: flex; flex-direction: column; gap: 10px; }
    .ranking-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid var(--line);
      transition: border-color .15s ease, background-color .15s ease;
      cursor: pointer;
    }
    .ranking-item:hover { border-color: var(--accent); }
    .ranking-item.is-me {
      background: color-mix(in srgb, var(--accent) 6%, var(--card));
      border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
    }
    .rank-num {
      font-size: 1.15rem;
      font-weight: 800;
      width: 34px;
      text-align: center;
      color: var(--muted);
      flex-shrink: 0;
    }
    .rank-num.medal-1 { color: #f59e0b; font-size: 1.45rem; }
    .rank-num.medal-2 { color: #94a3b8; font-size: 1.35rem; }
    .rank-num.medal-3 { color: #d97706; font-size: 1.35rem; }

    .ranking-main-info { flex: 1; min-width: 0; }
    .ranking-user-name { font-weight: 600; font-size: 1rem; display: flex; align-items: center; gap: 6px; }
    .ranking-meta { font-size: .82rem; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
    .ranking-score-box { text-align: right; flex-shrink: 0; }
    .ranking-score-value { font-size: 1.35rem; font-weight: 800; }
    .ranking-score-denom { font-size: .85rem; color: var(--muted); font-weight: 500; }

    /* Detalle expandido del usuario */
    .user-detail-card {
      margin-top: -6px;
      margin-bottom: 6px;
      padding: 16px;
      border-radius: 0 0 var(--radius) var(--radius);
      border: 1px solid var(--line);
      border-top: 0;
      background: color-mix(in srgb, var(--bg) 50%, var(--card));
      animation: fadeIn .15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }

    .topic-breakdown-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .topic-mini-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      font-size: .85rem;
    }
    .topic-mini-card .title { font-weight: 600; margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .filter-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .sort-select {
      font: inherit;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
    }

    /* ---------------- Modo Test / Examen ---------------- */
    button.btn-test {
      background: #059669;
      border-color: #059669;
      color: #fff;
      font-weight: 600;
    }
    button.btn-test:hover {
      background: #047857;
      border-color: #047857;
    }
    button.btn-test-outline {
      border-color: #059669;
      color: #059669;
      font-weight: 600;
    }
    button.btn-test-outline:hover {
      background: color-mix(in srgb, #059669 12%, transparent);
    }

    /* ---------------- Modo Forzar Estudio (SRS Adelantado) ---------------- */
    button.btn-force-study {
      background: #7c3aed;
      border-color: #7c3aed;
      color: #fff;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all .15s ease;
    }
    button.btn-force-study:hover {
      background: #6d28d9;
      border-color: #6d28d9;
    }
    button.btn-force-study-outline {
      border-color: #7c3aed;
      color: #7c3aed;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all .15s ease;
    }
    button.btn-force-study-outline:hover {
      background: color-mix(in srgb, #7c3aed 12%, transparent);
    }
    .tag-forced {
      background: color-mix(in srgb, #7c3aed 14%, transparent);
      color: #7c3aed;
      border: 1px solid color-mix(in srgb, #7c3aed 35%, transparent);
      font-weight: 700;
    }

    @media (prefers-color-scheme: dark) {
      button.btn-force-study {
        background: #8b5cf6;
        border-color: #8b5cf6;
      }
      button.btn-force-study:hover {
        background: #7c3aed;
        border-color: #7c3aed;
      }
      button.btn-force-study-outline {
        border-color: #a78bfa;
        color: #c4b5fd;
      }
      button.btn-force-study-outline:hover {
        background: color-mix(in srgb, #8b5cf6 20%, transparent);
      }
      .tag-forced {
        background: color-mix(in srgb, #8b5cf6 22%, transparent);
        color: #c4b5fd;
        border-color: color-mix(in srgb, #8b5cf6 45%, transparent);
      }
    }

    .test-progress-bar {
      height: 7px;
      background: var(--line);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .test-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--accent) 0%, #10b981 100%);
      border-radius: 99px;
      transition: width .25s ease;
    }

    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
      animation: fadeIn .15s ease;
    }
    .modal-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }
    .chip-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .chip-btn {
      border-radius: 99px;
      padding: 6px 14px;
      font-size: .88rem;
      font-weight: 500;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      cursor: pointer;
      transition: all .15s ease;
    }
    .chip-btn:hover { border-color: var(--accent); }
    .chip-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }

    .test-hero-card {
      text-align: center;
      padding: 28px 16px;
      border-top: 5px solid var(--accent);
      margin-bottom: 16px;
    }
    .test-hero-score {
      font-size: 3.4rem;
      font-weight: 900;
      line-height: 1.1;
      margin: 6px 0;
    }

    .test-review-item {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color .15s ease;
    }
    .test-review-item.is-correct { border-left: 5px solid var(--ok); }
    .test-review-item.is-wrong { border-left: 5px solid var(--bad); }

    .test-review-options {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: .92rem;
    }
    .test-review-opt {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--bg);
      display: flex;
      gap: 8px;
      align-items: baseline;
    }
    .test-review-opt.opt-correct {
      background: var(--ok-bg);
      border-color: var(--ok);
      font-weight: 600;
    }
    .test-review-opt.opt-wrong {
      background: var(--bad-bg);
      border-color: var(--bad);
      text-decoration: line-through;
    }

    @media (max-width: 580px) {
      .podium { gap: 6px; }
      .podium-slot { padding: 12px 6px; }
      .podium-score { font-size: 1.2rem; }
      .ranking-item { padding: 10px 12px; gap: 10px; }
      .ranking-score-value { font-size: 1.15rem; }
      .topic-breakdown-grid { grid-template-columns: 1fr; }
      .grades { grid-template-columns: repeat(2, 1fr); }
      .topic { flex-wrap: wrap; }
      .topic button { width: 100%; }
      .test-hero-score { font-size: 2.8rem; }
    }
  </style>
</head>
<body>
  <main id="app"></main>
  <script src="chart.umd.min.js"></script>
  <script src="subjects.js"></script>
  <script src="statistical-programming.js"></script>
  <script src="data-mining.js"></script>
  <script src="srs.js"></script>
  <script src="stats.js"></script>
  <script src="main.js"></script>
</body>
</html>
